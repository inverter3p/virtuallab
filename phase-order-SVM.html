 }else if(step===2){
 title='Recover the three phase references';lead='Inverse Clarke gives three signed phase voltages. Together, their contributions reconstruct the reference vector.';
 a=eq('\\begin{aligned}V_a&=V_\\alpha^*\\\\V_b&=-\\tfrac12V_\\alpha^*+\\tfrac{\\sqrt3}{2}V_\\beta^*\\\\V_c&=-\\tfrac12V_\\alpha^*-\\tfrac{\\sqrt3}{2}V_\\beta^*\\end{aligned}')+C.abc.map((v,i)=>row('V'+names[i],f(v)+' V')).join('')+eq('\\vec V_{\\mathrm{ref}}=\\tfrac23(V_a\\vec a+V_b\\vec b+V_c\\vec c)')+'<details><summary>Define the unit vectors</summary>'+eq('\\vec a=e^{j0},\\quad\\vec b=e^{j2\\pi/3},\\quad\\vec c=e^{-j2\\pi/3}')+'<p>Va is a scalar voltage; a⃗ is a unit direction. The three fixed phase axes are 120° apart.</p></details>';
 b='<h2>abc over one electrical revolution</h2>'+phaseWave()+'<p class="subtle"><span style="color:#2463eb">● a</span> &nbsp; <span style="color:#009a82">● b</span> &nbsp; <span style="color:#e48a20">● c</span></p><label>Sampled angle · '+f(C.theta)+'°<input type="range" id="angle" min="0" max="360" step="1" value="'+C.theta+'"></label><p class="subtle">Va + Vb + Vc = 0. These are voltage references, before switching.</p>';
 body=grid(panel(a),panel(b,true));
 }else if(step===3){
 title='Three directions become two';lead='Sort the signed phase voltages. The maximum selects p; the minimum selects −n. The physical abc axes stay fixed.';
 a=eq('V_p\\ge V_m\\ge V_n')+row('(p, m, n)','('+C.order.map(i=>names[i]).join(', ')+')')+row('ΔVpm = Vp − Vm',f(C.gap1)+' V')+row('ΔVmn = Vm − Vn',f(C.gap2)+' V')+eq('\\vec p+\\vec m+\\vec n=0')+eq('\\vec V_{\\mathrm{ref}}=\\tfrac23\\big[(V_p-V_m)\\vec p+(V_m-V_n)(-\\vec n)\\big]')+hint('Both coefficients are nonnegative. They are weights on two directions 60° apart, not orthogonal projections.')+'<details><summary>Follow the algebra from abc</summary><p>The ordered unit vectors p⃗, m⃗, n⃗ are a permutation of a⃗, b⃗, c⃗. Relabel the original definition, then use m⃗ = −p⃗ − n⃗:</p>'+eq('\\begin{aligned}\\vec V_{\\mathrm{ref}}&=\\tfrac23(V_p\\vec p+V_m\\vec m+V_n\\vec n)\\\\&=\\tfrac23[(V_p-V_m)\\vec p+(V_n-V_m)\\vec n]\\end{aligned}')+'<p>The middle phase is absorbed into the two voltage differences.</p></details>';
 b=segment([['three','Three contributions'],['two','Two contributions']],'view',view)+contributionSummary()+vectors(view)+'<p class="subtle">All contributions include ⅔. Dashed translated arrows show the sum; both constructions end at the same dark Vref.</p>';
 body=grid(panel(a),panel(b,true));
 }else if(step===4){
 title='Turn directions into switching states';lead='Connect the windings to the DC rails. Each active switching state creates a fixed voltage vector.';
 a=circuit()+'<p class="subtle">1 means the upper switch is ON. State bits always follow physical a, b, c order.</p>';
 b=eq(stateView?'\\vec U_{-n}=\\tfrac{2V_{\\mathrm{dc}}}{3}(\\vec p+\\vec m)=\\tfrac{2V_{\\mathrm{dc}}}{3}(-\\vec n)':'\\vec U_p=\\tfrac{2V_{\\mathrm{dc}}}{3}\\vec p')+row('vpm',stateView?'0 V':f(C.dc)+' V')+row('vmn',stateView?f(C.dc)+' V':'0 V')+row('Active-vector magnitude',f(2*C.dc/3)+' V')+hint(stateView?'p and m connect to the upper rail; n connects to the lower rail. The line voltage vmn is Vdc.':'p connects to the upper rail; m and n connect to the lower rail. The line voltage vpm is Vdc.')+'<details><summary>Derive from real winding voltages</summary>'+eq('v_{xN}=V_{\\mathrm{dc}}\\left(S_x-\\frac{S_a+S_b+S_c}{3}\\right)')+'<p>For an ideal inverter and balanced star load with no zero-sequence back EMF:</p>'+eq(stateView?'(v_{pN},v_{mN},v_{nN})=\\tfrac{V_{\\mathrm{dc}}}{3}(1,1,-2)':'(v_{pN},v_{mN},v_{nN})=\\tfrac{V_{\\mathrm{dc}}}{3}(2,-1,-1)')+'<p>Insert these winding voltages into the same space-vector definition to obtain the selected inverter vector.</p></details>';
 body=synthesisDiagram(false)+'<details class="winding-details"><summary>Connect these vectors to the winding circuit</summary>'+segment([[0,'p00 · Up · '+C.states[1].join('')],[1,'pm0 · U−n · '+C.states[2].join('')]],'state',stateView)+grid(panel(a,true),panel(b))+'</details>';
 }else if(step===5){
 title='Match volt-seconds to find the dwell';lead='Apply full-amplitude pulses for only part of the period. Their average must equal the requested line voltage.';
 a='<h2>From line voltage to time</h2>'+eq('\\underbrace{(V_p-V_m)T_s}_{\\text{required volt-seconds}}=\\underbrace{V_{\\mathrm{dc}}T_p}_{\\text{applied volt-seconds}}')+eq('T_p=T_s\\frac{V_p-V_m}{V_{\\mathrm{dc}}}')+eq('T_{-n}=T_s\\frac{V_m-V_n}{V_{\\mathrm{dc}}}')+hint('If Up stays ON for 100% of Ts, vpm = Vdc. A smaller requested average needs only that fraction of the full switching period.');
 b='<h2>This sample</h2>'+eq('\\begin{aligned}T_p&='+f(C.ts)+'\\frac{'+f(C.gap1)+'}{'+f(C.dc)+'}='+f(C.tp)+'\\,\\mu\\mathrm s\\\\[6pt]T_{-n}&='+f(C.ts)+'\\frac{'+f(C.gap2)+'}{'+f(C.dc)+'}='+f(C.tn)+'\\,\\mu\\mathrm s\\\\[6pt]T_0&='+f(C.ts)+'-'+f(C.tp)+'-'+f(C.tn)+'\\\\&='+f(C.t0)+'\\,\\mu\\mathrm s\\end{aligned}')+eq('\\vec V_{\\mathrm{ref}}=\\frac{T_p}{T_s}\\vec U_p+\\frac{T_{-n}}{T_s}\\vec U_{-n}')+'<p>'+ (C.valid?'✓ All dwell times fit inside Ts.':'The command exceeds the linear synthesis boundary.')+'</p><p class="subtle">Feasibility: Vp − Vn ≤ Vdc. References are constant within Ts; dead time and device drops are neglected.</p>';
 body=synthesisDiagram(true)+'<div class="wide">'+grid(panel(a),panel(b))+'</div>';
 }else if(step===6){
 title='Build the switching sequence';lead='Turn on p, then m, then n. Reverse the order to complete a centered seven-segment period.';
 if(!C.valid)body=panel('<h2>No feasible linear PWM sequence</h2><p>T0 = '+f(C.t0)+' μs. Negative zero-vector time cannot be scheduled.</p><p>Reduce the command magnitude or increase Vdc. Overmodulation requires a separate voltage-limiting rule.</p><button id="command">Edit FOC command</button>');
 else{
 let k=6;for(let i=0;i<7;i++)if(cursor*C.ts/100<C.bounds[i+1]){k=i;break}
 const st=C.states[k],selected=outputVoltages(st)[phase],average=C.states.reduce((sum,state,i)=>sum+outputVoltages(state)[phase]*C.durations[i]/C.ts,0),symbol='v_{'+names[phase]+(voltage==='line'?names[(phase+1)%3]:'0')+'}';
 a=eq('p='+names[C.p]+',\\qquad m='+names[C.m]+',\\qquad n='+names[C.n])+
 segment([['pole','Phase-leg voltage'],['line','Line voltage']],'voltage',voltage)+segment([[0,voltage==='line'?'ab':'a'],[1,voltage==='line'?'bc':'b'],[2,voltage==='line'?'ca':'c']],'phase',phase)+
 '<p class="subtle">The first binary row uses ordered '+inline('(p,m,n)')+' bits: p00 = 100, pm0 = 110. The second row uses physical '+inline('(a,b,c)')+' bits for the Sa, Sb, Sc waveforms. Here, p00 maps to '+C.states[1].join('')+' and pm0 maps to '+C.states[2].join('')+' in abc order.</p><div class="wave">'+timing()+'</div><label>Inspect the switching instant · '+f(cursor*C.ts/100)+' μs<input id="cursor" type="range" min="0" max="99.99" step=".1" value="'+cursor+'"></label><div class="stats"><div class="stat"><small>State SaSbSc</small><strong>'+st.join('')+'</strong></div><div class="stat"><small>'+inline(symbol)+' at cursor</small><strong>'+f(selected)+' V</strong></div><div class="stat"><small>Average '+inline(symbol)+'</small><strong>'+f(average)+' V</strong></div></div><p class="subtle">Phase-leg voltage is measured relative to the lower DC rail '+inline('0')+'. Line voltage is the difference between two phase-leg voltages. Solid traces show instantaneous outputs; dashed voltage shows the switching-period average.</p><details><summary>Sequence times and output voltages</summary><div class="tablewrap"><table><thead><tr><th>Ordered state</th><th>Bits (p,m,n)</th><th>Bits (a,b,c)</th><th>Duration</th>'+names.map((n,i)=>'<th>'+inline('v_{'+n+(voltage==='line'?names[(i+1)%3]:'0')+'}')+' (V)</th>').join('')+'</tr></thead><tbody>'+
 C.states.map((state,i)=>'<tr><td>'+orderedStates[i]+'</td><td>'+orderedBits[i]+'</td><td>'+state.join('')+'</td><td>'+inline(intervalTex[i])+' = '+f(C.durations[i],3)+' μs</td>'+outputVoltages(state).map(v=>'<td>'+f(v)+'</td>').join('')+'</tr>').join('')+
 '</tbody></table></div>'+eq('\\overline{\\vec V}=\\frac{T_p\\vec U_p+T_{-n}\\vec U_{-n}}{T_s}=\\vec V_{\\mathrm{ref}}')+'<p>000 and 111 both produce zero line voltage. Their phase-leg voltages are 0 and Vdc, respectively. Lower switches are complementary to Sa, Sb, Sc in this ideal model.</p></details>';

 body=panel(a);
 }
 }else if(step===7){
 title='Create a rotating reference';lead='Keep Vd and Vq fixed and advance the electrical angle. Watch the selected phase axes and their dwell times change together.';body=rotationBody();
 }
 if(window.MathJax?.typesetClear)MathJax.typesetClear([$('#content')]);
 $('#content').className='step-'+step;
 $('#content').innerHTML='<div class="eyebrow">STEP '+String(step+1).padStart(2,'0')+' / 08</div><h1>'+title+'</h1><p class="lead">'+lead+'</p>'+body+(step&&step!==7?'<p class="sample">Current sample: Vd* = '+f(C.d)+' V · Vq* = '+f(C.q)+' V · θe = '+f(C.theta)+'° · Vdc = '+f(C.dc,0)+' V · Ts = '+f(C.ts)+' μs</p>':'');
 $('#back').disabled=step===0;$('#next').textContent=step===7?'Back to command ↺':'Next step →';$('#progress').textContent=(step+1)+' of 8';
 normalizeTextNotation();
 bind();renderMath();
 if(step===7)refreshRotation();
}
function normalizeTextNotation(){
 const root=$('#content'),walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
 while(walk.nextNode()){
  const node=walk.currentNode;if(node.parentElement.closest('svg,.equation,mjx-container,script,input')||node.nodeValue.includes('\\(')||node.nodeValue.includes('\\['))continue;
  nodes.push(node);
 }
 const map={'Vref':'\\vec V_{\\mathrm{ref}}','Up':'\\vec U_p','U−n':'\\vec U_{-n}','T−n':'T_{-n}','Tp':'T_p','T0':'T_0','Ts':'T_s','Vdc':'V_{\\mathrm{dc}}','Vd*':'V_d^*','Vq*':'V_q^*','θe':'\\theta_e','Va':'V_a','Vb':'V_b','Vc':'V_c','Vp':'V_p','Vm':'V_m','Vn':'V_n','vpm':'v_{pm}','vmn':'v_{mn}','Sa':'S_a','Sb':'S_b','Sc':'S_c','a⃗':'\\vec a','b⃗':'\\vec b','c⃗':'\\vec c','p⃗':'\\vec p','m⃗':'\\vec m','n⃗':'\\vec n'};
 const re=/(?<![A-Za-z])(Vref|U−n|Up|T−n|Tp|T0|Ts|Vdc|Vd\*|Vq\*|θe|Va|Vb|Vc|Vp|Vm|Vn|vpm|vmn|Sa|Sb|Sc|a⃗|b⃗|c⃗|p⃗|m⃗|n⃗)(?![A-Za-z])/g;
 nodes.forEach(node=>{node.nodeValue=node.nodeValue.replace(re,m=>inline(map[m]));});
}
function bind(){
 document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=+b.dataset.step;draw()});
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;draw()});
 document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{stateView=+b.dataset.state;draw();if($('.winding-details'))$('.winding-details').open=true});
 document.querySelectorAll('[data-voltage]').forEach(b=>b.onclick=()=>{voltage=b.dataset.voltage;draw()});
 document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{phase=+b.dataset.phase;draw()});
 if($('#rotation-play'))$('#rotation-play').onclick=()=>playing?stopRotation():startRotation();
 if($('#rotation-speed')){$('#rotation-speed').value=playSpeed;$('#rotation-speed').onchange=e=>{playSpeed=+e.target.value;};}
 if($('#rotation-angle'))$('#rotation-angle').oninput=e=>{stopRotation();values.theta=+e.target.value;refreshRotation();};
 if($('#rotation-reset'))$('#rotation-reset').onclick=()=>{stopRotation();values.theta=0;refreshRotation();};
 for(const id of Object.keys(values)){const el=$('#'+id);if(el)el.onchange=()=>{if(!el.checkValidity()||!Number.isFinite(el.valueAsNumber)){el.reportValidity();return}values[id]=el.valueAsNumber;draw()};}
 if($('#angle'))$('#angle').onchange=e=>{values.theta=+e.target.value;draw();$('#angle').focus()};
 if($('#cursor'))$('#cursor').onchange=e=>{cursor=+e.target.value;draw();$('#cursor').focus()};
 if($('#reset'))$('#reset').onclick=()=>{values={d:120,q:40,theta:30,dc:300,ts:100};draw()};
 if($('#command'))$('#command').onclick=()=>{step=0;draw()};
}
$('#back').onclick=()=>{if(step>0)step--;draw();window.scrollTo(0,0)};
$('#next').onclick=()=>{step=(step+1)%8;draw();window.scrollTo(0,0)};
draw();

</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWM Generator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <style>
        /* Custom scrollbar to match the clean aesthetic */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // Lightweight Plotly Wrapper for React
        const Plot = ({ data, layout, config }) => {
            const plotRef = useRef(null);

            useEffect(() => {
                if (plotRef.current && window.Plotly) {
                    window.Plotly.react(plotRef.current, data, layout, config);
                }
            }, [data, layout, config]);

            return <div ref={plotRef} style={{ width: '100%', height: '100%' }} />;
        };

        const App = () => {
            const [modulationIndex, setModulationIndex] = useState(0.75);
            const [windowWidth, setWindowWidth] = useState(window.innerWidth);

            // Handle window resize for responsive plot
            useEffect(() => {
                const handleResize = () => setWindowWidth(window.innerWidth);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // Generate waveform data
            const data = useMemo(() => {
                const points = 1000;
                const cycles = 4; // Number of periods to show
                const t = [];
                const carrier = [];
                const threshold = [];
                const pwm = [];

                // Colors matching the reference image (Seaborn 'deep' palette)
                const colorCarrier = 'rgb(76, 114, 176)';
                const colorSignal = 'rgb(196, 78, 82)';

                for (let i = 0; i <= points; i++) {
                    const time = (i / points) * cycles;
                    t.push(time);

                    // Generate Triangle Wave (0 to 1 amplitude, starts at 0, peaks at 0.5, ends at 1.0)
                    const cyclePos = time % 1;
                    const triVal = 1 - Math.abs(2 * cyclePos - 1);
                    carrier.push(triVal);

                    // Threshold line (Vmod)
                    threshold.push(modulationIndex);

                    // PWM Logic: High when Signal > Carrier
                    pwm.push(modulationIndex > triVal ? 1 : 0);
                }

                return { t, carrier, threshold, pwm, colorCarrier, colorSignal };
            }, [modulationIndex]);

            // Calculate Duty Cycle for display
            const dutyCycle = Math.round(modulationIndex * 100);

            // Common layout settings to match the matplotlib/seaborn style
            const layoutStyle = {
                plot_bgcolor: '#EAEAF2', // Light grey background
                paper_bgcolor: 'white',
                font: { family: 'Helvetica', size: 12 },
                showlegend: true,
                margin: { l: 60, r: 30, t: 50, b: 50 },
                xaxis: {
                    showgrid: true,
                    gridcolor: 'white',
                    gridwidth: 1,
                    zeroline: false,
                    title: 'Time',
                    range: [0, 4]
                },
                yaxis: {
                    showgrid: true,
                    gridcolor: 'white',
                    gridwidth: 1,
                    zeroline: false,
                    range: [-0.05, 1.05],
                    title: 'Amplitude'
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col items-center py-8 font-sans text-gray-800">
                    
                    {/* Header Section */}
                    <header className="mb-8 text-center space-y-2 px-4">
                        <h1 className="text-3xl font-bold text-gray-900 ">PWM Generator</h1>
                        <p className="text-gray-500 max-w-md mx-auto">
                            Adjust the modulation voltage (V<sub>mod</sub>) to see how it intersects with the carrier wave to change the pulse width.
                        </p>
                    </header>

                    {/* Main Card */}
                    <div className="bg-white p-6 rounded-xl shadow-lg border border-gray-200 w-full max-w-4xl mx-4">
                        
                        {/* Controls */}
                        <div className="flex flex-col sm:flex-row items-center justify-between mb-6 bg-gray-50 p-4 rounded-lg border border-gray-100">
                            <div className="w-full sm:w-2/3 pr-0 sm:pr-8">
                                <label className="flex justify-between text-sm font-semibold mb-2">
                                    <span>Modulation Voltage (V<sub>mod</sub>)</span>
                                    <span className="text-blue-600 font-mono">{modulationIndex.toFixed(2)}V</span>
                                </label>
                                <input
                                    type="range"
                                    min="0"
                                    max="1"
                                    step="0.01"
                                    value={modulationIndex}
                                    onChange={(e) => setModulationIndex(parseFloat(e.target.value))}
                                    className="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-blue-600 hover:accent-blue-700 transition-colors"
                                />
                            </div>
                            
                            <div className="mt-4 sm:mt-0 flex flex-col items-center justify-center w-full sm:w-1/3 border-l-0 sm:border-l border-gray-200 pl-0 sm:pl-8">
                                <span className="text-xs text-gray-500 uppercase tracking-wide font-bold">Duty Cycle</span>
                                <span className="text-4xl font-mono text-red-500 font-bold">{dutyCycle}%</span>
                            </div>
                        </div>

                        {/* Plots */}
                        <div className="w-full overflow-hidden">
                            <Plot
                                data={[
                                    // Subplot 1: Carrier & Signal
                                    {
                                        x: data.t,
                                        y: data.carrier,
                                        type: 'scatter',
                                        mode: 'lines',
                                        name: 'Carrier',
                                        line: { color: data.colorCarrier, width: 2 },
                                        xaxis: 'x',
                                        yaxis: 'y'
                                    },
                                    {
                                        x: data.t,
                                        y: data.threshold,
                                        type: 'scatter',
                                        mode: 'lines',
                                        name: 'Modulated Signal',
                                        line: { color: data.colorSignal, width: 2.5 },
                                        xaxis: 'x',
                                        yaxis: 'y'
                                    },
                                    // Subplot 2: PWM Output
                                    {
                                        x: data.t,
                                        y: data.pwm,
                                        type: 'scatter',
                                        mode: 'lines',
                                        name: 'PWM_A',
                                        line: { color: data.colorSignal, width: 2, shape: 'hv' },
                                        xaxis: 'x',
                                        yaxis: 'y2'
                                    }
                                ]}
                                layout={{
                                    ...layoutStyle,
                                    width: Math.min(windowWidth - 80, 850),
                                    height: 600,
                                    grid: { rows: 2, columns: 1, pattern: 'independent', roworder: 'top to bottom' },
                                    title: {
                                        text: `Modulation Waveform: m = ${modulationIndex.toFixed(2)}`,
                                        font: { family: 'serif', size: 18 }
                                    },
                                    // Axis specific overrides
                                    xaxis: { ...layoutStyle.xaxis, showticklabels: false, title: '' },
                                    yaxis: { ...layoutStyle.yaxis, domain: [0.55, 1] },
                                    xaxis2: { ...layoutStyle.xaxis, anchor: 'y2' },
                                    yaxis2: { ...layoutStyle.yaxis, domain: [0, 0.45], title: 'Logic Level' },
                                    legend: { x: 0.7, y: 1.05, bgcolor: 'rgba(255,255,255,0.8)', bordercolor: '#ccc', borderwidth: 1 }
                                }}
                                config={{ displayModeBar: false, staticPlot: false, responsive: true }}
                            />
                        </div>
                    </div>

                    {/* Footer Info */}
                    <div className="mt-8 text-sm text-gray-400 max-w-2xl text-center px-4">
                        Logic: <span className="font-mono text-gray-600">if (Signal &gt; Carrier) Output = HIGH</span>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
